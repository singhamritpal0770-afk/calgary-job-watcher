name: job-watcher

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub may delay this to ~every 5-15 min
  workflow_dispatch:

concurrency:
  group: watcher
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: |
            state-

      - name: Run watcher
        env:
          NTFY_TOPIC_OTHER: ${{ secrets.NTFY_TOPIC_OTHER }}
        run: python3 watcher.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
