name: job-watcher

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub may delay this to ~every 5-15 min
  workflow_dispatch:

concurrency:
  group: watcher
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: |
            state-

      - name: Run watcher
        env:
          NTFY_TOPIC_OTHER: ${{ secrets.NTFY_TOPIC_OTHER }}
          NTFY_TOPIC_AMAZON: ${{ secrets.NTFY_TOPIC_AMAZON }}
          NTFY_EMAIL: ${{ secrets.NTFY_EMAIL }}
        # GitHub throttles */5 crons to ~hourly in practice, so each run
        # covers a 15-minute window, checking the boards every 5 minutes.
        run: python3 watcher.py --loop 4 --sleep 300

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
